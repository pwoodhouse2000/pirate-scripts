server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    location ~* \.(js|css)$ { add_header Cache-Control "public, max-age=3600"; }
    location / { try_files $uri $uri/ /index.html; }
}
